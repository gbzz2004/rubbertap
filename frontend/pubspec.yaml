name: frontend
description: RubberTap - Rubber Farm Yield Forecasting App
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  dio: ^5.4.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.0.0
  table_calendar: ^3.1.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  shared_preferences: ^2.5.6
  maplibre_gl: ^0.28.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  app_settings: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bundled (not downloaded) so the app looks the same with no signal.
  # Both are open fonts (SIL OFL): see assets/fonts/*-OFL.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-400.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-500.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-600.ttf
          weight: 600