# Runs the ML models on GitHub's machines and saves the results to Supabase.
# The phone app reads the saved results, so it never needs the developer's PC.
#
# Starts:  every day at 06:00 Philippine time, from the "Run workflow" button
#          on GitHub (Actions tab), and from the Supabase Edge Function
#          (app's "Update forecast" button / new harvest record).
# Secrets: SUPABASE_URL and SUPABASE_KEY (Settings > Secrets and variables > Actions)

name: Forecast

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 06:00 in Manila
  workflow_dispatch:
    inputs:
      trigger:
        description: "Why this run started (manual, button, new_record)"
        required: false
        default: manual

# Never run two at once; a new request waits for the current run
concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run models and save results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Passed through env (not pasted into the command) so input text can't run as code
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
        run: python run_forecasts.py --trigger "$RUN_TRIGGER"
